# Topgrade 配置（由 dotfiles 管理）
# 注意：topgrade 只读取 ~/.config/topgrade.toml（最高优先级路径），
# 不读取 ~/.config/topgrade/topgrade.toml（实测 17.9.0 不生效）。

[misc]
# 跳过 macOS 系统更新（softwareupdate）与容器步骤（本机 docker daemon 不常开）
disable = ["system", "containers"]
# topgrade 自身由 Cargo 步骤（cargo-install-update）负责更新，
# 避免自更新请求 GitHub API 时再触发限流 403
no_self_update = true
