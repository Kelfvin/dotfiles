# Atuin 配置（由 dotfiles 管理，所有机器共享）
# 文档：https://docs.atuin.sh/configuration/

# ╭──────────────────────────────────────────────────────────╮
# │                         同步                             │
# ╰──────────────────────────────────────────────────────────╯
# Mac ↔ 实验室服务器共用一份历史（端到端加密）。
# 首次使用需在每台机器执行：atuin register（新账号）或 atuin login（已有账号）
auto_sync = true
sync_frequency = "5m"
# sync_address = "https://api.atuin.sh"   # 默认官方服务端；自建则改这里

# ╭──────────────────────────────────────────────────────────╮
# │                        搜索体验                          │
# ╰──────────────────────────────────────────────────────────╯
# fuzzy 对齐原 fzf <C-r> 的习惯；inline_height 内嵌在提示符上方，不全屏
search_mode = "fuzzy"
filter_mode = "host"        # 默认只搜本机历史；<C-r> 界面里可临时切 global/ directory
style = "auto"
inline_height = 20
show_preview = true         # 预览完整多行命令

# ╭──────────────────────────────────────────────────────────╮
# │                          安全                            │
# ╰──────────────────────────────────────────────────────────╯
# 自动过滤疑似密钥/token 的命令；另可按正则追加忽略项
secrets_filter = true
# history_filter = [ "^sudo rm" ]
